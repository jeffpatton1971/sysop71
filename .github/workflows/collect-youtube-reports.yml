name: Collect Encrypted YouTube Reports

on:
  workflow_call:
    inputs:
      report_start:
        type: string
        required: true
      report_end:
        type: string
        required: true
      report_public_key:
        type: string
        required: true
      report_request_id:
        type: string
        required: true

permissions:
  contents: read

jobs:
  collect:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Collect reports using the existing read-only grant
        shell: pwsh
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          KEY_VAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID }}
          REPORT_START: ${{ inputs.report_start }}
          REPORT_END: ${{ inputs.report_end }}
          REPORT_PUBLIC_KEY: ${{ inputs.report_public_key }}
          REPORT_REQUEST_ID: ${{ inputs.report_request_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          try {
            $refreshToken = az keyvault secret show --vault-name $env:KEY_VAULT_NAME --name 'YouTube-RefreshToken' --query value -o tsv --only-show-errors 2>$null
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($refreshToken)) { throw 'Key Vault read failed.' }
            Write-Output "::add-mask::$refreshToken"
            $token = Invoke-RestMethod -Method Post -Uri 'https://oauth2.googleapis.com/token' -ContentType 'application/x-www-form-urlencoded' -Body @{
              client_id = $env:YT_CLIENT_ID
              client_secret = $env:YT_CLIENT_SECRET
              refresh_token = $refreshToken
              grant_type = 'refresh_token'
            }
            if ([string]::IsNullOrWhiteSpace($token.access_token)) { throw 'No access token.' }
            Write-Output "::add-mask::$($token.access_token)"
            $env:YT_ACCESS_TOKEN = $token.access_token
          } catch {
            Write-Host '::error::Unable to obtain the read-only access token. Run the connection diagnostic.'
            exit 1
          }
          node --import tsx scripts/collect-youtube-runner.ts
          $collectionExit = $LASTEXITCODE
          Remove-Item Env:\YT_ACCESS_TOKEN
          exit $collectionExit
      - name: Upload encrypted reports only
        uses: actions/upload-artifact@v4
        with:
          name: youtube-${{ inputs.report_request_id }}
          path: .tmp/youtube-encrypted/report.enc.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
